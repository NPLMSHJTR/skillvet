name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  no-dependencies:
    name: test without PyYAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with no runtime dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Confirm no runtime dependency was pulled in
        run: |
          python - <<'PY'
          import skillvet.frontmatter as fm
          assert fm._yaml is None, "PyYAML must not be present in this job"
          print("fallback parser active")
          PY
      - name: Run the suite with the fallback parser forced on
        run: python -m pytest

  dogfood:
    name: lint our own skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Every shipped example must pass with warnings as errors
        run: python -m skillvet examples --strict --no-color
      - name: The rule set must flag a known-bad skill
        run: |
          mkdir -p /tmp/bad/pdf_tables
          printf -- '---\nname: PDF_Tables\ndescription: Helps with files.\n---\n\n' > /tmp/bad/pdf_tables/SKILL.md
          if python -m skillvet /tmp/bad --no-color; then
            echo "expected a non-zero exit for a bad skill"; exit 1
          fi
          echo "known-bad skill correctly failed"

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/